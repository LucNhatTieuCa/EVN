<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF tiền điện EVN</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#173242;color:#dcebf5;font:14px system-ui,sans-serif}button,a,select{font:inherit}button,a.btn{display:inline-block;padding:8px 12px;background:#30566b;color:#e0edf5;border:1px solid #567888;border-radius:5px;text-decoration:none}select{padding:8px;background:#173242;color:#e0edf5;border:1px solid #567888;border-radius:5px}[hidden],#invoicePDFOpen{display:none!important}#invoicePDFPages{overflow:auto;background:#e4e7eb;padding:8px;margin-top:12px;border-radius:6px}#invoicePDFPages canvas{display:block;max-width:100%;height:auto;margin:0 auto 12px;background:white}#invoicePDFStatus{line-height:1.6;font-size:12px}h1{font-size:18px;margin:12px 0}nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}button:disabled{opacity:.5}
</style></head><body><button type="button" onclick="history.length>1?history.back():location.assign('/npc-monitor/index.html')">← Quay lại</button><h1>PDF tiền điện EVN</h1>
<select id="accountSelect" hidden></select><section id="invoicePDFPanel"><nav><label for="invoicePDFPeriod">Tháng</label><select id="invoicePDFPeriod" disabled></select><button id="invoicePDFView" disabled>Xem PDF</button><a id="invoicePDFDownload" class="btn" hidden>Tải PDF</a><a id="invoicePDFOpen" hidden></a><button id="invoicePDFClose" hidden>Đóng PDF</button></nav><p id="invoicePDFStatus" aria-live="polite"></p><div id="invoicePDFPages" hidden></div><iframe id="invoicePDFFrame" hidden title="PDF"></iframe></section>
<script>
const params=new URLSearchParams(location.search),code=params.get('account')||'',ident=params.get('invoice')||'';
if(/^[A-Z0-9]{8,30}$/.test(code)&&/^\d+$/.test(ident)){
 document.getElementById('accountSelect').add(new Option(code,code));
 let tries=0;const timer=setInterval(()=>{const selector=document.getElementById('invoicePDFPeriod'),button=document.getElementById('invoicePDFView');if(!button.disabled&&Array.from(selector.options).some(o=>o.value===ident)){clearInterval(timer);selector.value=ident;button.click();}else if(++tries>100)clearInterval(timer);},200);
}else document.getElementById('invoicePDFStatus').textContent='Liên kết PDF không hợp lệ.';
</script><script src="assets/js/invoice-pdf.js?v=20261027-opt1"></script></body></html>
